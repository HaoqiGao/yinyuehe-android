name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Isolate API 36 to align with AGP 8.12 support and keep mutable runner images from changing lint results.
      - name: Configure isolated Android SDK
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, and debug build
        run: ./gradlew test testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Build instrumentation APKs
        run: ./gradlew :app:assembleDebugAndroidTest :feature:library:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest --stacktrace
